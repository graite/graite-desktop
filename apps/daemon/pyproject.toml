[project]
name = "graite-daemon"
version = "0.1.0"
description = "Graite local daemon: vault, index, models, agents, jobs."
license = "Apache-2.0"
authors = [{ name = "Graite contributors" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "sqlite-vec>=0.1.6",
  "python-frontmatter>=1.3.0",
  "pyyaml>=6.0.3",
  "httpx>=0.28.1",
  "keyring>=25.7.0",
  "psutil>=7.2.2",
  "gguf>=0.19.0",
  "av>=16",
  "pypdfium2>=4.30",
  "pillow>=11",
  "watchfiles>=1.0",
  "croniter>=2.0",
  "mcp>=1.25,<3",
  "numpy>=2.0",
  "onnxruntime>=1.20",
]

[project.urls]
Homepage = "https://github.com/graite/graite-desktop"
Repository = "https://github.com/graite/graite-desktop"
Issues = "https://github.com/graite/graite-desktop/issues"

[project.scripts]
graite-daemon = "graite.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-pyyaml>=6.0.12.20260906",
  "types-croniter>=6.2.4.20260711",
]
build = ["pyinstaller>=6.10", "patchelf>=0.19; sys_platform == 'linux'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graite"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
[[tool.mypy.overrides]]
module = ["sqlite_vec", "psutil", "gguf", "pypdfium2", "onnxruntime"]
ignore_missing_imports = true
