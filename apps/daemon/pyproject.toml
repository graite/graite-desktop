[project]
name = "graite-daemon"
version = "0.5.5"
description = "Graite local daemon: vault, index, models, agents, jobs."
license = "Apache-2.0"
authors = [{ name = "Graite contributors" }]
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.165",
  "uvicorn[standard]>=0.54",
  "pydantic-settings>=2.16",
  "sqlite-vec>=0.1.6",
  "python-frontmatter>=1.3.0",
  "pyyaml>=6.0.3",
  "httpx>=0.28.1",
  "keyring>=25.7.0",
  "psutil>=7.2.2",
  "gguf>=0.19.0",
  "av>=19",
  "pypdfium2>=5.15",
  "pillow>=13",
  "watchfiles>=1.3",
  "croniter>=7",
  "mcp>=2.3,<3",
  "numpy>=2.5",
  "onnxruntime>=1.32",
  "pynacl>=1.5",
  "merge3>=0.0.15",
]

[project.urls]
Homepage = "https://github.com/graite/graite-desktop"
Repository = "https://github.com/graite/graite-desktop"
Issues = "https://github.com/graite/graite-desktop/issues"

[project.scripts]
graite-daemon = "graite.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.2",
  "pytest-asyncio>=1.5",
  "httpx>=0.27",
  "ruff>=0.17",
  "mypy>=2.4",
  "types-pyyaml>=6.0.12.20261113",
  "types-croniter>=6.2.4.20261118",
]
build = ["pyinstaller>=6.22", "patchelf>=0.19; sys_platform == 'linux'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graite"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
[[tool.mypy.overrides]]
module = ["sqlite_vec", "psutil", "gguf", "pypdfium2", "onnxruntime"]
ignore_missing_imports = true
