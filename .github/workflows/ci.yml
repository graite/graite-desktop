name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # uv's own Python builds: runner/Homebrew Pythons may lack sqlite3 extension loading,
  # which sqlite-vec needs (and the macOS sidecar would ship).
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  daemon:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/daemon
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: uv.lock is up to date
        working-directory: .
        run: uv lock --check
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy graite
      - name: pytest
        shell: bash
        run: uv run pytest -q -rf --tb=short 2>&1 | tee pytest.log
      - if: failure()
        shell: bash
        run: ../../.github/scripts/annotate-failure.sh pytest.log "pytest ${{ matrix.os }}"
      # The packaging risk (docs/decisions.md D8) is exercised on every change, not only at release time.
      - run: uv run --group build pyinstaller graite-daemon.spec --noconfirm
      - name: smoke-test the sidecar
        shell: bash
        # selftest + a real start that must answer on the API (scripts/smoke-sidecar.sh)
        run: ../../scripts/smoke-sidecar.sh dist/graite-daemon/graite-daemon 2>&1 | tee smoke.log
      - if: failure()
        shell: bash
        run: ../../.github/scripts/annotate-failure.sh smoke.log "sidecar smoke ${{ matrix.os }}"
      - uses: actions/upload-artifact@v7
        with:
          name: graite-daemon-${{ matrix.os }}
          path: apps/daemon/dist/graite-daemon
          retention-days: 7

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check "apps/desktop/src/**/*.{ts,tsx,css}" "packages/*/src/**/*.ts"
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - name: vitest
        shell: bash
        run: pnpm -r test 2>&1 | tee vitest.log
        env:
          NO_COLOR: "1"
      - if: failure()
        run: .github/scripts/annotate-failure.sh vitest.log vitest
      - name: dependency audit (advisory)
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true

  desktop:
    # Windows too: the shell has Windows-only code (console flags, open/reveal) that Linux never compiles.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: tauri system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter desktop build # tauri::generate_context! embeds ../dist
      - if: runner.os == 'Linux'
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - name: clippy
        shell: bash
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.log
      - name: cargo test
        shell: bash
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml 2>&1 | tee cargo-test.log
      - if: failure()
        shell: bash
        run: |
          .github/scripts/annotate-failure.sh clippy.log "clippy ${{ matrix.os }}"
          .github/scripts/annotate-failure.sh cargo-test.log "cargo test ${{ matrix.os }}"
