name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # dry run: build every bundle, upload as artifacts, publish nothing

permissions:
  contents: write # tauri-action creates the draft release and uploads assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel a release build half-way

env:
  CARGO_TERM_COLOR: always
  # uv's own Python builds: runner/Homebrew Pythons may lack sqlite3 extension loading,
  # which sqlite-vec needs (and the macOS sidecar would ship).
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          # `updates`: the app updates itself on this platform, so the build also makes signed
          # update files and latest.json. Windows is updated by the Microsoft Store instead.
          - os: ubuntu-22.04
            bundles: appimage,deb
            updates: true
          - os: macos-latest # Apple silicon runner (aarch64-apple-darwin)
            bundles: app,dmg # `app` keeps Graite.app in bundle/macos for the in-bundle smoke test
            updates: true
          - os: windows-latest
            bundles: nsis # msi later: WiX's 260-char source-path limit vs the deep PyInstaller onedir (docs/development.md, Releasing)
            updates: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # macOS Developer ID signing + notarization runs only when the secrets exist (not in forks).
      HAVE_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_API_KEY_P8 != '' }}
      # Update files are signed with Tauri's updater key; without the secret (forks) none are made.
      UPDATER_ARGS: ${{ matrix.updates && secrets.TAURI_SIGNING_PRIVATE_KEY != '' && '--config src-tauri/tauri.updater.conf.json' || '' }}
    steps:
      - uses: actions/checkout@v4

      # ---- macOS signing: one temporary keychain, used by our daemon signing and by Tauri ----
      # tauri-action gets APPLE_SIGNING_IDENTITY but never APPLE_CERTIFICATE, so it signs with
      # this keychain instead of importing the certificate a second time.
      - name: macOS signing setup
        if: runner.os == 'macOS' && env.HAVE_APPLE_SIGNING == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/graite-signing.keychain-db"
          password="$(openssl rand -base64 32)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          # The Developer ID - G2 intermediate, so the identity chains to Apple's root.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          # Put it first in the search list, keeping the existing keychains.
          existing="$(security list-keychains -d user | sed -e 's/^ *"//' -e 's/" *$//')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain" $existing
          security find-identity -v -p codesigning "$keychain" | grep -F "$APPLE_SIGNING_IDENTITY" \
            || { echo "::error::signing identity not found in the imported certificate"; exit 1; }
          # notarytool (via Tauri, and our DMG step) reads the App Store Connect key from a file.
          umask 077
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_API_KEY=$APPLE_API_KEY"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            echo "MACOS_SIGNING_KEYCHAIN=$keychain"
            echo "MACOS_SIGNED=true"
          } >> "$GITHUB_ENV"
      - name: macOS without signing secrets
        if: runner.os == 'macOS' && env.HAVE_APPLE_SIGNING != 'true'
        shell: bash
        run: |
          # A release whose notes say "signed and notarized" must never ship unsigned.
          if [ "$GITHUB_REPOSITORY" = graite/graite-desktop ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::APPLE_* signing secrets are missing; refusing to build an unsigned macOS release"
            exit 1
          fi
          echo "::warning::APPLE_* signing secrets are missing; building an unsigned macOS bundle"
      - name: updater key
        if: matrix.updates && env.UPDATER_ARGS == ''
        shell: bash
        run: |
          # Installed copies look at the newest release for latest.json; a release without it
          # would leave them unable to update.
          if [ "$GITHUB_REPOSITORY" = graite/graite-desktop ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is missing; refusing to build a release without update files"
            exit 1
          fi
          echo "::warning::TAURI_SIGNING_PRIVATE_KEY is missing; building without update files"

      # ---- Python sidecar: built on each OS, smoke-tested, placed into src-tauri/resources/daemon ----
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: install the daemon with its build group
        working-directory: apps/daemon
        run: uv sync --locked --all-groups
      - name: pyinstaller
        working-directory: apps/daemon
        run: uv run --group build pyinstaller graite-daemon.spec --noconfirm
      - name: smoke-test the packaged daemon
        shell: bash
        run: scripts/smoke-sidecar.sh
      - name: place the sidecar in src-tauri/resources/daemon
        shell: bash
        run: scripts/place-sidecar.sh
      - name: sign the sidecar (macOS)
        if: runner.os == 'macOS' && env.MACOS_SIGNED == 'true'
        shell: bash
        run: scripts/sign-sidecar-macos.sh 2>&1 | tee sign-sidecar.log
      - if: failure() && runner.os == 'macOS'
        shell: bash
        run: .github/scripts/annotate-failure.sh sign-sidecar.log "sign sidecar"
      - name: smoke-test the signed sidecar (hardened runtime)
        if: runner.os == 'macOS' && env.MACOS_SIGNED == 'true'
        shell: bash
        run: scripts/smoke-sidecar.sh apps/desktop/src-tauri/resources/daemon/graite-daemon

      # ---- Desktop toolchain ----
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: the tag must start with the tauri.conf.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          case "${GITHUB_REF_NAME}" in
            "v$version" | "v$version"-*) ;;
            *) echo "tag ${GITHUB_REF_NAME} does not match v$version or v$version-<suffix>"; exit 1 ;;
          esac
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Runtime GStreamer plugins only: bundleMediaFramework copies plugins, not headers, and
          # the -dev packages clash with the runner's preinstalled libunwind-14-dev.
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pulseaudio \
            gstreamer1.0-tools 2>&1 | tee apt.log
          # bundleMediaFramework copies every GStreamer plugin present on the machine into the
          # AppImage. Keep GPL codec plugins out of an Apache-2.0 download.
          sudo apt-get remove -y 'gstreamer1.0-plugins-ugly*' gstreamer1.0-libav || true
      - if: failure()
        shell: bash
        run: .github/scripts/annotate-failure.sh apt.log "apt ${{ matrix.os }}"

      # ---- Tag push: build and attach to a draft release ----
      - name: build bundles and draft the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: Graite ${{ github.ref_name }}
          releaseBody: |
            Preview builds. macOS: signed and notarized (Apple silicon).
            Windows: unsigned, SmartScreen shows "unknown publisher".
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --bundles ${{ matrix.bundles }} ${{ env.UPDATER_ARGS }}

      # ---- Manual run: same build, artifacts only ----
      - name: build bundles (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --bundles ${{ matrix.bundles }} ${{ env.UPDATER_ARGS }}

      # ---- macOS: Tauri notarizes and staples Graite.app, but only signs the DMG ----
      - name: notarize and staple the dmg
        if: runner.os == 'macOS' && env.MACOS_SIGNED == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dmg="$(ls apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg)"
          echo "notarizing $dmg"
          result="$(xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait --output-format json)"
          echo "$result"
          id="$(jq -r .id <<< "$result")"
          if [ "$(jq -r .status <<< "$result")" != Accepted ]; then
            xcrun notarytool log "$id" --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" || true
            echo "::error::notarization of the dmg was not accepted"
            exit 1
          fi
          xcrun stapler staple "$dmg"
          # tauri-action already attached the unstapled dmg; replace it.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release upload "$GITHUB_REF_NAME" "$dmg" --clobber
          fi
      - name: verify the macOS signature and notarization
        if: runner.os == 'macOS' && env.MACOS_SIGNED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          app=apps/desktop/src-tauri/target/release/bundle/macos/Graite.app
          dmg="$(ls apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg)"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl -a -vv -t exec "$app"
          xcrun stapler validate "$dmg"
          # The update archive is what installed copies download: the app inside it must be the
          # signed, notarized and stapled one, since the updater installs it as it is.
          archive="$(ls apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz 2>/dev/null | head -n 1 || true)"
          if [ -n "$archive" ]; then
            check="$RUNNER_TEMP/update-archive"
            mkdir -p "$check" && tar -xzf "$archive" -C "$check"
            codesign --verify --deep --strict --verbose=2 "$check/Graite.app"
            xcrun stapler validate "$check/Graite.app"
          fi

      # ---- Microsoft Store: pack the same build into an unsigned .msix (the Store signs it) ----
      - name: build msix
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: scripts/build-msix.ps1 -Layout "$env:RUNNER_TEMP/msix" 2>&1 | Tee-Object msix.log
      - if: failure() && runner.os == 'Windows'
        shell: bash
        run: .github/scripts/annotate-failure.sh msix.log "msix"
      - name: smoke-test the daemon inside the msix layout
        if: runner.os == 'Windows'
        shell: bash
        run: scripts/smoke-sidecar.sh "$RUNNER_TEMP/msix/resources/daemon/graite-daemon.exe"
      - name: attach the msix to the draft release
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" apps/desktop/src-tauri/target/release/bundle/msix/*.msix --clobber
      - name: upload bundles (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: graite-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msix/*.msix

      # ---- Post-build checks on the bundle that will ship ----
      - name: AppImage media plugins load from the bundle
        if: runner.os == 'Linux'
        run: scripts/check-appimage-media.sh
      - name: no GPL GStreamer plugins slipped into the AppImage
        if: runner.os == 'Linux'
        run: "! ls apps/desktop/src-tauri/target/release/bundle/appimage/Graite.AppDir/usr/lib/gstreamer-1.0 | grep -Ei 'x264|libav|ugly'"
      - name: smoke-test the daemon inside the bundle
        if: runner.os != 'Windows'
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) root=apps/desktop/src-tauri/target/release/bundle/appimage ;;
            macOS) root=apps/desktop/src-tauri/target/release/bundle/macos ;;
          esac
          exe="$(find "$root" -path '*resources/daemon/graite-daemon' -type f | head -n 1)"
          echo "daemon in bundle: ${exe:-not found}" | tee smoke-bundle.log
          [ -n "$exe" ] || { find "$root" -maxdepth 6 | head -n 60 >> smoke-bundle.log; exit 1; }
          scripts/smoke-sidecar.sh "$exe" 2>&1 | tee -a smoke-bundle.log
      - if: failure()
        shell: bash
        run: .github/scripts/annotate-failure.sh smoke-bundle.log "bundle smoke ${{ matrix.os }}"
      - name: remove the signing keychain and API key
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          [ -n "${MACOS_SIGNING_KEYCHAIN:-}" ] && security delete-keychain "$MACOS_SIGNING_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/certificate.p12"
