name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # dry run: build every bundle, upload as artifacts, publish nothing

permissions:
  contents: write # tauri-action creates the draft release and uploads assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel a release build half-way

env:
  CARGO_TERM_COLOR: always
  # uv's own Python builds: runner/Homebrew Pythons may lack sqlite3 extension loading,
  # which sqlite-vec needs (and the macOS sidecar would ship).
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: appimage,deb
          - os: macos-latest # Apple silicon runner (aarch64-apple-darwin)
            bundles: app,dmg # `app` keeps Graite.app in bundle/macos for the in-bundle smoke test
          - os: windows-latest
            bundles: nsis # msi later: WiX's 260-char source-path limit vs the deep PyInstaller onedir (docs/development.md, Releasing)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # ---- Python sidecar: built on each OS, smoke-tested, placed into src-tauri/resources/daemon ----
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: install the daemon with its build group
        working-directory: apps/daemon
        run: uv sync --locked --all-groups
      - name: pyinstaller
        working-directory: apps/daemon
        run: uv run --group build pyinstaller graite-daemon.spec --noconfirm
      - name: smoke-test the packaged daemon
        shell: bash
        run: scripts/smoke-sidecar.sh
      - name: place the sidecar in src-tauri/resources/daemon
        shell: bash
        run: scripts/place-sidecar.sh

      # ---- Desktop toolchain ----
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: the tag must start with the tauri.conf.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          case "${GITHUB_REF_NAME}" in
            "v$version" | "v$version"-*) ;;
            *) echo "tag ${GITHUB_REF_NAME} does not match v$version or v$version-<suffix>"; exit 1 ;;
          esac
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Runtime GStreamer plugins only: bundleMediaFramework copies plugins, not headers, and
          # the -dev packages clash with the runner's preinstalled libunwind-14-dev.
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pulseaudio \
            gstreamer1.0-tools 2>&1 | tee apt.log
          # bundleMediaFramework copies every GStreamer plugin present on the machine into the
          # AppImage. Keep GPL codec plugins out of an Apache-2.0 download.
          sudo apt-get remove -y 'gstreamer1.0-plugins-ugly*' gstreamer1.0-libav || true
      - if: failure()
        shell: bash
        run: .github/scripts/annotate-failure.sh apt.log "apt ${{ matrix.os }}"

      # ---- Tag push: build and attach to a draft release ----
      - name: build bundles and draft the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: Graite ${{ github.ref_name }}
          releaseBody: |
            Unsigned preview builds. macOS: run `xattr -cr /Applications/Graite.app` after
            copying the app from the DMG. Windows: SmartScreen shows "unknown publisher".
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --bundles ${{ matrix.bundles }}

      # ---- Manual run: same build, artifacts only ----
      - name: build bundles (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --bundles ${{ matrix.bundles }}
      - name: upload bundles (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: graite-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

      # ---- Post-build checks on the bundle that will ship ----
      - name: AppImage media plugins load from the bundle
        if: runner.os == 'Linux'
        run: scripts/check-appimage-media.sh
      - name: no GPL GStreamer plugins slipped into the AppImage
        if: runner.os == 'Linux'
        run: "! ls apps/desktop/src-tauri/target/release/bundle/appimage/Graite.AppDir/usr/lib/gstreamer-1.0 | grep -Ei 'x264|libav|ugly'"
      - name: smoke-test the daemon inside the bundle
        if: runner.os != 'Windows'
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) root=apps/desktop/src-tauri/target/release/bundle/appimage ;;
            macOS) root=apps/desktop/src-tauri/target/release/bundle/macos ;;
          esac
          exe="$(find "$root" -path '*resources/daemon/graite-daemon' -type f | head -n 1)"
          echo "daemon in bundle: ${exe:-not found}" | tee smoke-bundle.log
          [ -n "$exe" ] || { find "$root" -maxdepth 6 | head -n 60 >> smoke-bundle.log; exit 1; }
          scripts/smoke-sidecar.sh "$exe" 2>&1 | tee -a smoke-bundle.log
      - if: failure()
        shell: bash
        run: .github/scripts/annotate-failure.sh smoke-bundle.log "bundle smoke ${{ matrix.os }}"
